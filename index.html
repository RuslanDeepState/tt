<title>War Changers</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Gate: private preview behind a PIN. Same tokens as the page. */
:root{--bg:#0C100D;--panel:#141B16;--line:#27402F;--text:#E6F0E8;--muted:#86A08F;--acc:#7CE08A;--red:#F0868D;--onacc:#0C100D;--mono:"IBM Plex Mono","Courier New",monospace;--body:"IBM Plex Sans","Calibri","Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 1rem/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#gate{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));background-image:linear-gradient(#16221A 1px,transparent 1px),linear-gradient(90deg,#16221A 1px,transparent 1px);background-size:96px 96px}
#gate[hidden]{display:none}
.gbox{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line)}
.gtop{background:var(--text);padding:18px 22px}
.gtop img{display:block;height:48px;width:auto;max-width:100%}
.gbody{padding:22px}
.glab{font:500 .72rem/1.3 var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--acc)}
.gbody p{margin:.6rem 0 1.2rem;color:var(--muted);font-size:.95rem}
.gbody label{display:block;font:500 .72rem/1.3 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
#pin{width:100%;font:500 1.5rem/1 var(--mono);letter-spacing:.5em;text-align:center;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:.8rem .5rem;-webkit-appearance:none;appearance:none}
#pin:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 1px var(--acc)}
.gbox.bad #pin{border-color:var(--red)}
#gerr{min-height:1.4em;margin:.5rem 0 .8rem;font-size:.85rem;color:var(--red)}
#gbtn{width:100%;font:600 .78rem/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;padding:.95rem 1.25rem;border:1px solid var(--acc);background:var(--acc);color:var(--onacc);cursor:pointer}
#gbtn[disabled]{opacity:.6;cursor:progress}
:focus-visible{outline:2px solid #E8B84A;outline-offset:2px}
</style>
</head>

const gate=document.getElementById("gate"), gform=document.getElementById("gform"), pin=document.getElementById("pin"), gerr=document.getElementById("gerr"), gbtn=document.getElementById("gbtn");
let fails=0, lockUntil=0;
async function open(p){
  const raw=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:raw.slice(0,16),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(16,28)},key,raw.slice(28));
  return JSON.parse(new TextDecoder().decode(pt));
}
function mount(d){
  const st=document.createElement("style"); st.textContent=d.css; document.head.appendChild(st);
  document.getElementById("app").innerHTML=d.html; gate.hidden=true;
  const sc=document.createElement("script"); sc.textContent=d.js; document.body.appendChild(sc);
  window.scrollTo(0,0);
}
gform.addEventListener("submit",async e=>{
  e.preventDefault();
  const now=Date.now();
  if(now<lockUntil){gerr.textContent="Too many attempts. Wait a few seconds and try again.";return}
  const v=pin.value.trim(); if(!v){gerr.textContent="Enter the PIN.";pin.focus();return}
  if(!(window.crypto&&crypto.subtle)){gerr.textContent="This browser cannot open the preview. Try another browser.";return}
  gbtn.disabled=true; gbtn.textContent="Checking…"; gerr.textContent=""; gform.classList.remove("bad");
  try{ const d=await open(v); try{sessionStorage.setItem("wcpin",v)}catch(_){} mount(d); }
  catch(err){
    fails++; if(fails>=5){lockUntil=Date.now()+8000;fails=0}
    gform.classList.add("bad"); gerr.textContent="Incorrect PIN. Please try again."; pin.value=""; pin.focus();
  }finally{ gbtn.disabled=false; gbtn.textContent="Open" }
});
try{const s=sessionStorage.getItem("wcpin"); if(s&&window.crypto&&crypto.subtle){open(s).then(mount).catch(()=>{})}}catch(_){}
